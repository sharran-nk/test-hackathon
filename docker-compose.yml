# Two services: the app (React build + Express API) and MongoDB.
# Secrets come from .env (never committed). Every variable marked ":?" must be set or
# `docker compose up` stops with a clear message.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      # Only used the FIRST time the volume is created. Changing them later does not change the
      # existing database user (see docs/DEPLOY.md).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db        # named volume: data survives container restarts and rebuilds
    networks:
      - private                    # internal network only. There is NO "ports:" here, so 27017 is never published.
    healthcheck:
      # Logs in with the root user (read from the container's own environment, so the password is
      # not written in this file or on a command line) and pings the server.
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy   # the app starts only after MongoDB answers a login
    ports:
      - "${APP_PORT:-3000}:3000"     # the only published port; override only if 3000 is busy on the host
    environment:
      PORT: "3000"
      MAX_BODY_KB: ${MAX_BODY_KB:-1024}
      MAX_FINDINGS: ${MAX_FINDINGS:-1000}
      MIN_REST_HOURS: ${MIN_REST_HOURS:-11}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:?Set MANAGER_PASSWORD in .env}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # The app builds the MongoDB URI itself from these, URL-encoding the username and password
      # (server/db.js). Compose cannot URL-encode, so the URI is not written here.
      MONGO_HOST: mongo              # the service name on the private network
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    networks:
      - default                      # reachable from the host on port 3000
      - private                      # talks to mongo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  private:
    internal: true                   # no route to or from the outside world

volumes:
  mongo_data:
